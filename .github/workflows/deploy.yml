# CI/CD — Valmer (Perfila)
#
#   push em `develop` -> CI -> deploy HML
#   push em `master`  -> CI -> deploy PRD
#
# O deploy em si mora na VPS (scripts/infra/deploy.sh). O Actions so faz login
# por SSH e chama o script. Isso mantem UM caminho de deploy: o mesmo comando
# que o CI roda e o que o Paulo roda a mao quando o GitHub estiver fora do ar.
#
# O backup antes do PRD nao esta aqui de proposito — quem faz e o deploy.sh, no
# proprio servidor. Assim a string de conexao de producao nunca precisa existir
# como secret do GitHub, e o dump nunca passa pela infraestrutura de terceiro.
#
# Secrets (Settings > Secrets and variables > Actions, por Environment):
#   hml: HML_SSH_HOST, HML_SSH_USER, HML_SSH_PORT, HML_SSH_KEY, HML_KNOWN_HOSTS
#   prd: PRD_SSH_HOST, PRD_SSH_USER, PRD_SSH_PORT, PRD_SSH_KEY, PRD_KNOWN_HOSTS
#
# A chave e a do usuario `deploy`, que na VPS nao tem sudo irrestrito: ele so
# reinicia valmer-hml e valmer-prd (ver scripts/infra/01-acesso.sh).

name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  ci:
    name: Type Check + Testes + Build
    runs-on: ubuntu-latest

    # O app mora em perfila/, e nao na raiz do repositorio.
    defaults:
      run:
        working-directory: perfila

    # Os testes sao de integracao contra Postgres de verdade (tests/*.test.mts).
    # Nao ha versao com SQLite nem com mock: e regra do projeto.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: valmer_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/valmer_ci
      # Valor descartavel, so para o boot passar. Nao e o segredo de nenhum
      # ambiente — os de verdade so existem em /srv/valmer/<amb>/env na VPS.
      BETTER_AUTH_SECRET: ci-somente-para-o-boot-nao-e-segredo-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: perfila/package-lock.json

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Migracoes
        run: npm run db:migrate

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Conformidade da base
        working-directory: .
        run: node scripts/check-compliance.mjs

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prd' || 'hml' }}
    steps:
      # A VPS ainda nao existe quando estas branches nascem. Sem esta trava,
      # todo push acende um X vermelho por falta de servidor, e CI que vive
      # vermelha ensina o time a nao olhar para ela.
      # Ligar em Settings > Environments > <hml|prd> > Variables:
      #     DEPLOY_HABILITADO = true
      - name: Ambiente alvo
        id: alvo
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then echo "amb=prd" >> "$GITHUB_OUTPUT"
          else echo "amb=hml" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ vars.DEPLOY_HABILITADO }}" != "true" ]; then
            echo "::notice::Deploy desligado neste ambiente (DEPLOY_HABILITADO != true). CI passou, nada foi publicado."
          fi

      - name: Configurar SSH
        if: vars.DEPLOY_HABILITADO == 'true'
        env:
          CHAVE: ${{ github.ref == 'refs/heads/master' && secrets.PRD_SSH_KEY || secrets.HML_SSH_KEY }}
          HOSTS: ${{ github.ref == 'refs/heads/master' && secrets.PRD_KNOWN_HOSTS || secrets.HML_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      # deploy.sh monta a release nova, so troca o symlink se o build passou,
      # faz o dump antes de migrar em PRD e confere que a app respondeu.
      # Se ele sair diferente de zero, nada foi trocado ou o rollback esta a um
      # comando de distancia — a mensagem dele diz qual.
      - name: Deploy na VPS
        if: vars.DEPLOY_HABILITADO == 'true'
        env:
          USUARIO: ${{ github.ref == 'refs/heads/master' && secrets.PRD_SSH_USER || secrets.HML_SSH_USER }}
          HOST: ${{ github.ref == 'refs/heads/master' && secrets.PRD_SSH_HOST || secrets.HML_SSH_HOST }}
          PORTA: ${{ github.ref == 'refs/heads/master' && secrets.PRD_SSH_PORT || secrets.HML_SSH_PORT }}
          AMB: ${{ steps.alvo.outputs.amb }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORTA:-22}" \
            -o StrictHostKeyChecking=yes "$USUARIO@$HOST" \
            "bash /srv/valmer/bin/deploy.sh $AMB $GITHUB_SHA"
